# 256-color + sensible defaults
set -g default-terminal "tmux-256color"
set -g mouse on
set -g set-clipboard on   # mouse/copy-mode selections go to system clipboard (OSC 52)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Persistent pane labels: "1: claude" on each pane's top border
set -g pane-border-status top
set -g pane-border-format " #P: #{pane_current_command} "
set -g display-panes-time 2000   # C-a q numbers linger longer
set -g escape-time 10
set -g history-limit 50000

# Ctrl-a leader (Ctrl-b is awkward); keep C-b too
set -g prefix C-a
bind C-a send-prefix

# Intuitive splits, open in same dir
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"
