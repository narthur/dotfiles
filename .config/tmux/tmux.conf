# 256-color + sensible defaults
set -g default-terminal "tmux-256color"
set -ga terminal-features "*:RGB"   # truecolor passthrough (Ghostty supports it)
set -g mouse on
set -g set-clipboard on   # mouse/copy-mode selections go to system clipboard (OSC 52)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-titles on
set -g set-titles-string "#W"   # terminal tab = window name (dev sets this to the launch cwd)

# Persistent pane labels: "1: claude" on each pane's top border
set -g pane-border-status top
set -g pane-border-format " #P: #{pane_current_command} "
set -g display-panes-time 2000   # C-a q numbers linger longer
set -g escape-time 10
set -g history-limit 50000

# Ctrl-a leader (Ctrl-b is awkward); keep C-b too
set -g prefix C-a
bind C-a send-prefix

# Intuitive splits, open in same dir
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"

# Plugins (TPM). Install: prefix + I. Update: prefix + U.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin '2kabhishek/tmux2k'
set -g @tmux2k-theme 'catppuccin'
# Add a Claude Code quota segment to the left (project) cluster. The ccusage
# plugin script is a symlink into tmux2k/plugins/ -> ~/.claude/scripts/tmux-ccusage.sh
# (symlink is untracked so it survives `prefix + U`). Recreate with:
#   ln -sf ~/.claude/scripts/tmux-ccusage.sh ~/.config/tmux/plugins/tmux2k/plugins/ccusage.sh
set -g @tmux2k-left-plugins 'session git cwd ccusage'
set -g @tmux2k-ccusage-colors 'purple white'
# White segment text on darker, muted backgrounds (readable contrast)
set -g @tmux2k-text '#ffffff'
set -g @tmux2k-green '#3a6b4a'         # session, git
set -g @tmux2k-blue '#3a5a8c'          # cwd
set -g @tmux2k-light-green '#2f6f57'   # cpu
set -g @tmux2k-light-yellow '#7a5d28'  # ram
set -g @tmux2k-light-purple '#6c4f8c'  # battery
set -g @tmux2k-purple '#5b4d8c'        # network
set -g @tmux2k-light-blue '#356b80'    # time
set -g @tmux2k-prefix-highlight '#8aadf4'  # keep prefix indicator bright
# Powerline separators (Nerd Font glyphs)
set -g @tmux2k-left-sep ''
set -g @tmux2k-right-sep ''

# Auto-bootstrap TPM + plugins on a fresh machine (set-environment makes the
# headless install_plugins find the XDG plugin path)
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins/'
if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"

# Initialize TPM — keep this line at the very bottom
run '~/.config/tmux/plugins/tpm/tpm'

# White window-list text (tmux2k bakes dark text into its current-window
# format; override after TPM runs so it survives plugin updates)
set -wg window-status-current-format "#[fg=#ffffff,bg=#3a5a8c,bold] #I:#W#F "
set -wg window-status-format "#[fg=#9aa0b0,bg=#1e2030] #I:#W#F "


